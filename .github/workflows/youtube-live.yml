
name: Update YouTube Livestream

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-livestream
  cancel-in-progress: false

jobs:
  check-livestream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check YouTube livestream
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api_key = os.environ["YOUTUBE_API_KEY"]

          # Public Oxon Hill Church of Christ YouTube channel
          channel_id = "UCO5NVNcjxsgcHHzc_xCSlww"

          params = urllib.parse.urlencode({
              "part": "snippet",
              "channelId": channel_id,
              "eventType": "live",
              "type": "video",
              "maxResults": 1,
              "key": api_key
          })

          url = (
              "https://www.googleapis.com/youtube/v3/search?"
              + params
          )

          # Do not print the URL because it contains the API key.
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json"}
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              data = json.load(response)

          items = data.get("items", [])

          video_id = None

          if items:
              video_id = items[0].get("id", {}).get("videoId")

          output = {
              "live": bool(video_id),
              "videoId": video_id
          }

          Path("live-video.json").write_text(
              json.dumps(output, indent=2) + "\n",
              encoding="utf-8"
          )

          if video_id:
              print("An active livestream was found.")
          else:
              print("No active livestream found.")
          PY

      - name: Save livestream status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-video.json

          if git diff --cached --quiet; then
            echo "No livestream changes."
          else
            git commit -m "Update YouTube livestream status"
            git push
          fi
