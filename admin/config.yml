
backend:
  name: turbo-github
  turbo_site_id: REPLACE_WITH_ANGELAS_SITE_ID
  branch: main

media_folder: "images/uploads"
public_folder: "/Oxon-Hill-Church/images/uploads"

collections:
  # EXISTING CHURCH CALENDAR
  - name: "calendar"
    label: "Church Calendar"
    files:
      - name: "events"
        label: "Manage Events"
        file: "events.json"
        format: "json"
        fields:
          - label: "Special Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - label: "Event Name"
                name: "title"
                widget: "string"

              - label: "Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"

              - label: "Time"
                name: "time"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

  # NEW EDITABLE EVENT CARDS
  - name: "featured"
    label: "Featured Event Cards"
    files:
      - name: "featured_events"
        label: "Manage Upcoming and Past Events"
        file: "featured-events.json"
        format: "json"
        fields:
          - label: "Featured Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Event Name"
                name: "title"
                widget: "string"

              - label: "Event Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                required: false

              - label: "Event Time"
                name: "time"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

              - label: "Category"
                name: "category"
                widget: "string"
                required: false

              - label: "Event Photograph"
                name: "image"
                widget: "image"
                required: false

              - label: "Photo Description"
                name: "image_alt"
                widget: "string"
                required: false

              - label: "Event Status (If No Date)"
                name: "status"
                widget: "select"
                options:
                  - label: "Upcoming Event"
                    value: "upcoming"
                  - label: "Past Event"
                    value: "past"
                default: "past"
